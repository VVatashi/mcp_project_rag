services:
  postgres:
    build:
      context: ./docker/postgres
    image: projectrag-postgres:18-alpine
    container_name: projectrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectrag}
      POSTGRES_USER: ${POSTGRES_USER:-projectrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectrag}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-projectrag} -d ${POSTGRES_DB:-projectrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
