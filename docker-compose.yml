services:
  chroma:
    image: chromadb/chroma:latest
    container_name: mcp-rag-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - chroma_data:/data

  rag-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-project-rag-server
    restart: unless-stopped
    depends_on:
      - chroma
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3123
      MCP_HTTP_PATH: /mcp
      CHROMA_URL: http://chroma:8000
      MCP_DATA_DIR: /app/data
    ports:
      - "3123:3123"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3123/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - rag_server_data:/app/data
      - ./:/workspace/current-project:ro

volumes:
  chroma_data:
  rag_server_data:
