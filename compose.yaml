# The database of the knowledge base. Start it from the root of the repository:
#
#   docker compose up -d --build
#
# The llama.cpp servers and the application run on the host, not here.
# Docker Desktop gives a container the GPU through WSL2, and a GPU in the TCC mode of the Windows driver is not visible there.

name: project-rag

services:
  postgres:
    build: db
    image: project-rag-postgres:18.6-pgvector0.8.7
    environment:
      POSTGRES_DB: project_rag
      POSTGRES_USER: project_rag
      # The port opens on 127.0.0.1 only. Change the password in the file .env, see .env.example.
      POSTGRES_PASSWORD: ${PROJECT_RAG_DB_PASSWORD:-project_rag}
      # ICU gives the Russian collation. The locales of musl do not.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=ru-RU
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      # An HNSW index over 2560 dimensions builds in memory when it fits in maintenance_work_mem.
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=64MB
    ports:
      - 127.0.0.1:${PROJECT_RAG_DB_PORT:-5434}:5432
    volumes:
      # Since version 18 the image keeps PGDATA in /var/lib/postgresql/18/docker, so the volume mounts on /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # The parallel build of an HNSW index uses shared memory.
    shm_size: 1gb
    healthcheck:
      # The check goes over TCP. The temporary server that runs db/init listens on the socket only, so the database is healthy after the init.
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U project_rag -d project_rag]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
